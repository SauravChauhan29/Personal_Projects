<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>log-in page </title>
    <link rel="shortcut icon" href="./assets/title icon.png" type="image/x-icon">
    <link rel="stylesheet" href="./style.css">

    <!-- <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>

<body>
    <div class="container">
        <div class="rotator">
            <div class="bggg"></div>
            <div class="bggg2"></div>
        </div>
        <div class="wrapper">
            <div class="switch-div">
                <div class="signin-tag">sign in</div>
                <div class="signup-tag">sign up</div>
                <div class="sign-bg"></div>
            </div>

            <div class="signin-container">
                <div class="form-wrapper">
                    <form action="">
                        <div class="form-group">
                            <input type="text" class="form-control" id="text" placeholder=" "   />
                            <label for="email">Username</label>
                            <span class="error-message" id="loginUsernameError"></span>
                        </div>
                        <div>
                            <div class="form-group  psd">
                                <input type="password" class="form-control" id="pwd" placeholder=" "   />
                                <label for="pwd">Password</label>
                                <span class="error-message" id="loginPasswordError"></span>

                            </div>
                            <div class="checkbox">
                                <label><input type="checkbox"> Remember me</label>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-default">Submit</button>
                    </form>

                </div>
                <!-- <div class="signup-container"> -->
                <div class=" form-wrapper2">
                    <form action="" id="signupForm">
                        <div class="form-group">
                            <input type="text" class="form-control" id="setUsername" placeholder=" "   onkeyup="validateUsername()"/>
                            <label >New Username</label>
                            <span class="username-error" id="username-error" ></span>
                        </div>
                      
                        <div class="form-group">
                            <input type="text" class="form-control" id="setemail" placeholder=" "  onkeyup="validateEmailname() "/>
                            <label for="text">Email address</label>
                            <span class="email-error" id="email-error"></span>

                        </div>
                        <div class="form-group  psd">
                            <input type="password" class="form-control" id="setUserpassword" placeholder=" "   onkeyup="validatePassword() "/>
                            <label >New - Password</label>
                            <span class="password-error" id="password-error"></span>

                        </div>
                        <div class="form-group  psd">
                            <input type="password" class="form-control" id="confirmUserpassword" placeholder=" " onkeyup="validateConfirmPassword() "  />
                            <label for="pwd">Re - Enter Password</label>
                            <span class="password2-error" id="password2-error"></span>

                        </div>
                        <div class="checkbox">
                            <label><input type="checkbox"> Remember me</label>
                        </div>

                        <button class="btn btn-default" onclick=" validateForm() ">Submit</button>
                    </form>

                </div>

                <!-- </div> -->
            </div>
<div class="messges" style="color: white;">
    <div id="successMessage" class="success">Fill Form Correctly</div>
</div>
        </div>
      
    </div>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
    integrity="sha512-7eHRwcbYkK4d9g/6tD/mhkf++eoTHwpNM9woBxtPUBWm67zeAfFC+HrdoE2GanKeocly/VxeLvIqwvCdk7qScg=="
    crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="./index.js"></script>
<script src="./formvalidation.js"></script>

</html>
